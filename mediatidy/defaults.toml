# MediaTidy – default settings.
# Don't edit this file: your own values belong in ~/.mediatidy/config.toml
# (or in the app under "Settings"). Anything missing there comes from here.
# The comment above each setting is its English help text in the app; German help texts live in locales/de.toml.

version = 2

[files]
# File extensions per group (lower case, without dot)
photo = ["jpg", "jpeg", "heic", "heif", "png", "tif", "tiff", "webp", "gif", "bmp"]
raw = ["cr3", "cr2", "crw", "nef", "nrw", "arw", "srf", "sr2", "raf", "orf", "rw2", "pef", "dng", "srw", "3fr", "iiq", "x3f"]
video = ["mp4", "mov", "m4v", "avi", "mts", "m2ts", "3gp", "mkv"]
sidecar = ["xmp", "aae"]
# Groups that are processed
active_groups = ["photo", "raw", "video"]
# Take sidecars (e.g. .xmp) along when copying/moving
include_sidecars = true

[scan]
# Glob patterns for file and folder names that are skipped
ignore = [
  ".DS_Store", "._*", ".localized", "Thumbs.db", "desktop.ini",
  ".Trashes", ".Spotlight-V100", ".fseventsd", ".TemporaryItems",
  "*.lrdata", "*.lrcat", "*.lrcat-data", "Old Lightroom Catalogs",
  "_Duplicates", "_Duplikate", "_MediaTidy-Reports",
]
# Skip hidden files/folders (name starts with ".")
skip_hidden = true
# Follow symbolic links
follow_symlinks = false
# Report empty files (0 bytes) as "probably damaged" instead of comparing or copying them
empty_files_as_defect = true

# Package libraries: inside folders with this extension only the
# given subpaths are read (glob, relative to the package).
[[scan.libraries]]
extension = ".photoslibrary"
subfolders = ["originals"]

[[scan.libraries]]
extension = ".lrlibrary"
subfolders = ["*/originals"]

[[scan.libraries]]
extension = ".photolibrary"
subfolders = ["Masters"]

[compare]
# "hash" (content, safe) | "name_size" | "name_size_date"
method = "hash"
# "blake2b" | "sha256" | "md5" | "sha1"
hash_algorithm = "blake2b"
# Partial hash: this many KB from the start and the end as a pre-filter
partial_hash_kb = 1024
# Read buffer size in KB
read_buffer_kb = 4096
# Parallel read threads for internal SSDs
threads = 4
# Parallel read threads as soon as external drives (/Volumes) are involved (hard disks: 1)
threads_external = 1
# After an identical partial hash, compare the whole file to be sure.
# false = much faster (same size + start + end counts as identical), slightly less safe
full_hash = true
# Save the checksum cache every n files (progress survives a crash)
cache_save_every = 100

[metadata]
# Order of sources for the capture date; "file_mtime" = file modification date
date_fields = ["DateTimeOriginal", "CreateDate", "MediaCreateDate", "ModifyDate", "file_mtime"]
camera_fields = ["Model", "UniqueCameraModel"]
make_fields = ["Make"]
lens_fields = ["LensModel", "LensID", "Lens"]
# Text used when no value was found; empty = "Unknown" in the app language
unknown = ""
# Remove the make from the camera name ("Canon EOS R6" -> "EOS R6")
strip_make_from_camera = false
# Files per exiftool call
batch_size = 200
# Before a run, show new names ({Camera}, {Make}, {Lens} in the pattern) for review;
# confirmed names are stored in the mappings below and not asked again
review_names = true

# Renaming of camera names (exact name = display name)
[metadata.camera_names]
# "Canon EOS R6m2" = "R6 II"

# Renaming of camera makes (exact name = display name)
[metadata.make_names]
# "Canon" = "Canon"

# Renaming of lens names (exact name = display name)
[metadata.lens_names]
# "RF24-105mm F4 L IS USM" = "RF 24-105 F4"

[patterns]
# Folder structure presets (selectable in the app)
presets = [
  "{Year}/{Year}-{Month}-{Day}",
  "{Year}/{Month}",
  "{Year}/{Year}-{Month}",
  "{Camera}/{Year}/{Year}-{Month}-{Day}",
  "{Year}/{Camera}",
  "{Make}/{Camera}/{Year}",
  "{Type}/{Year}/{Month}",
  "{Lens}/{Year}",
]
default = "{Year}/{Year}-{Month}-{Day}"
# File name pattern; empty = keep the original name
# e.g. "{Year}{Month}{Day}_{Hour}{Minute}{Second}_{Name}"
filename = ""
# Month names for {MonthName}; empty = month names in the app language
month_names = []
# Characters that are replaced in folder names
invalid_chars = ":/\\?*\"<>|"
replacement_char = "_"

[actions]
# Dry run by default (nothing is changed, preview only)
dry_run = true
# Name collision with different content: "suffix" | "skip" | "overwrite"
collision = "suffix"
# Suffix pattern; {n} = running number
suffix_pattern = "_{n}"
# Verify the content by checksum after copying
verify_copy = true
# Keep file timestamps when copying
preserve_timestamps = true
# Ask before deleting, moving or overwriting
confirm = true
# Files in these folders (and libraries) are never moved or deleted (glob on the path)
protected = ["*.photoslibrary*", "*.lrlibrary*", "*.photolibrary*"]

[sync]
# Missing files: "structure" (keep the folder structure) | "pattern" (sort by pattern)
missing_placement = "structure"
# With "structure": create the source folder's name as top level in the target
source_folder_as_level = true
# Also sync sidecars (XMP, AAE) of files that are already in the target:
# add missing ones, report or replace changed ones
sync_sidecars = true
# Changed sidecars: "newer_replaces" (replace in the target when the source is newer – the old version
# is kept and can be restored with Undo) | "report_only"
changed_sidecar = "newer_replaces"

[duplicates]
# Which file is kept: "oldest" | "newest" | "shortest_path" | "longest_path" | "first"
keep = "oldest"
# "report" | "move" | "trash"
action = "report"
# Target folder (relative to the checked folder) for duplicates set aside; empty = "_Duplicates" ("_Duplikate" in German)
folder = ""

[reports]
# Folder for reports; empty = data folder/reports, real runs also put a copy into "_MediaTidy-Reports" in the target
folder = ""
csv = true
html = true

[paths]
# Empty = find automatically
exiftool = ""
# Working data (cache, journal, logs, profiles, dry-run reports); empty = settings folder (~/.mediatidy)
data_dir = ""
# Lightroom Classic catalogs (glob). Moving files out of their folders shows a warning.
lightroom_catalogs = ["~/Pictures/Lightroom/*.lrcat", "~/Pictures/Lightroom*/*.lrcat"]

[ui]
# "auto" (macOS language) | "en" | "de" – takes effect after a restart
language = "auto"
font_size = 13
window = "1100x800"

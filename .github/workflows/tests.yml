name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # also run by release.yml before building the app

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exiftool
        run: brew install exiftool
      - name: Compile all modules
        run: python -m compileall -q mediatidy tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Import the GUI module
        run: python -c "import mediatidy.gui"
      - name: Command line smoke test
        run: |
          python -m mediatidy --help
          python -m mediatidy --config-dir "$RUNNER_TEMP/cfg" check
